[tool.poetry]
name = "audit-service"
version = "0.1.0"
description = "Audit consumer service for LMS events"
authors = ["jurabek"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.12"
uvicorn = { extras = ["standard"], version = "^0.34.1" }
tortoise-orm = "^0.25.0"
asyncpg = "^0.30.0"
pydantic-settings = "^2.9.1"
aio-pika = "^9.5.5"

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.7"
pytest = "^8.3.5"
pytest-asyncio = "^0.26.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
