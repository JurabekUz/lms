[tool.poetry]
name = "identity-service"
version = "0.1.0"
description = "Identity service for the LMS platform"
authors = ["jurabek"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.12"
uvicorn = { extras = ["standard"], version = "^0.34.1" }
tortoise-orm = "^0.25.0"
asyncpg = "^0.30.0"
aerich = "^0.8.2"
pydantic-settings = "^2.9.1"
pyjwt = "^2.10.1"
passlib = { extras = ["bcrypt"], version = "^1.7.4" }
email-validator = "^2.2.0"
httpx = "^0.28.1"
fastapi-admin = "^1.0.4"
redis = "^5.2.1"
bcrypt = "4.3.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.7"
pytest = "^8.3.5"
pytest-asyncio = "^0.26.0"

[tool.aerich]
tortoise_orm = "app.db.init.TORTOISE_ORM"
location = "./migrations"
src_folder = "./."

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
